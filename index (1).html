<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00829C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Publimax">
<link rel="icon" href="data:,">
<title>Stock plaques Publimax</title>
<style>
/* Charte Publimax : turquoise 0,130,156 / gris 119,116,113 / Arial. Mobile d'abord, barre du bas au pouce, colonne centrée sur PC. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --sunk:#E8EEF0; --fg:#1B2529; --muted:#5F6B70; --line:#D3DCDF;
  --accent:#00829C; --accent-ink:#FFFFFF; --accent-soft:#DCF0F4; --gris:#777471;
  --bad:#B3382C; --bad-soft:#F8E4E1; --warn:#8F5309; --warn-soft:#FBEFD9; --good:#2B7A4B; --good-soft:#E3F2E9;
  --font:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101719; --surface:#182124; --sunk:#0E1416; --fg:#E4ECEE; --muted:#96A5AA; --line:#2A383C;
    --accent:#3DB8D1; --accent-ink:#06222A; --accent-soft:#123037;
    --bad:#EE8B80; --bad-soft:#3A1B18; --warn:#E3A850; --warn-soft:#33260F; --good:#5CC089; --good-soft:#14301F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
header.top{background:#FFFFFF;border-bottom:3px solid var(--accent);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top img{height:36px;width:auto;display:block;max-width:60vw}
header.top .ttl{font-size:13px;font-weight:bold;color:var(--gris);text-transform:uppercase;letter-spacing:.08em;text-align:right}
main{max-width:860px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar button{flex:1;min-width:0;padding:12px 4px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font-size:13px;font-weight:bold}
nav.bar button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
nav.bar .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px}
@media (min-width:760px){
  nav.bar{position:static;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:0 16px}
  nav.bar button{flex:0 0 auto;padding:12px 22px;border-top:0;border-bottom:3px solid transparent;font-size:14px}
  nav.bar button[aria-current="page"]{border-bottom-color:var(--accent)}
  main{padding-bottom:40px}
}
h2{font-size:18px;margin:4px 0 10px}
.hint{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;margin-bottom:12px;background:var(--accent-soft);border-radius:6px;font-size:14px}
.hint button{flex:none;background:none;border:0;color:var(--accent);font-weight:bold;padding:2px 6px}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.search{width:100%;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 13px;background:var(--surface);border:1px solid var(--line);border-radius:18px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:bold}
.chip.alert[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.grp{margin:18px 0 6px;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.1em;color:var(--gris)}
.card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card.low{border-color:var(--bad);background:linear-gradient(0deg,var(--bad-soft),var(--bad-soft)),var(--surface)}
.card .info{flex:1;min-width:0;cursor:pointer}
.card .t{font-weight:bold;overflow-wrap:anywhere}
.card .s{font-size:13px;color:var(--muted)}
.badge{display:inline-block;margin:4px 5px 0 0;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:bold}
.badge.bad{background:var(--bad);color:#fff}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.chu{background:var(--sunk);color:var(--muted)}
.qty{flex:none;display:flex;align-items:center;gap:6px}
.qty button{width:46px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1;font-weight:bold;color:var(--accent)}
.qty button:active{background:var(--accent-soft)}
.qty input{width:62px;height:46px;text-align:center;font-size:20px;font-weight:bold;background:var(--bg);border:1px solid var(--line);border-radius:8px;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;padding:14px 18px;border:0;border-radius:28px;background:var(--accent);color:var(--accent-ink);font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.28)}
@media (min-width:760px){.fab{bottom:24px}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:11px 8px;background:var(--surface);border:0;border-right:1px solid var(--line);font-weight:bold;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.urg[aria-pressed="true"]{background:var(--bad);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.row .info{flex:1;min-width:0}
.row .qi{width:64px;height:42px;text-align:center;font-size:18px;font-weight:bold;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.msg{width:100%;min-height:200px;margin:10px 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font:14px/1.45 Consolas,Menlo,monospace}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 140px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-weight:bold}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.urg{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
details.wk{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.wk>summary{padding:12px;cursor:pointer;font-weight:bold}
details.wk .sum{display:block;font-weight:normal;font-size:13px;color:var(--muted);margin-top:2px}
.ev{display:flex;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.ev .d{flex:none;width:76px;color:var(--muted);font-size:12px}
.ev .l{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .v{flex:none;font-weight:bold;font-variant-numeric:tabular-nums}
.ev .v.neg{color:var(--bad)} .ev .v.pos{color:var(--good)} .ev .v.cmd{color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:bold;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.set h3{margin:0 0 10px;font-size:15px}
.set p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{align-items:center}.panel{border-radius:12px}}
.panel h2{margin:0 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;max-width:92vw;padding:11px 16px;background:#1B2529;color:#fff;border-radius:8px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:#7FD6E8;font-weight:bold;padding:2px 4px}
@media (min-width:760px){.toast{bottom:28px}}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.lock[hidden]{display:none}
.lock h2{margin:0;font-size:20px}
.lock .li{width:11em;max-width:100%;padding:14px;text-align:center;font-size:30px;letter-spacing:.4em;background:var(--surface);border:2px solid var(--accent);border-radius:10px}
.lock .lm{min-height:20px;font-size:14px;color:var(--bad)}
.lock .ls{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px}
</style>
</head>

function isoWeek(t){

}

function hm(t){ return new Date(t).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}); }
function wkLabel(t){ var w = isoWeek(t), s = weekStart(t), e = new Date(s); e.setDate(e.getDate() + 6); return "Semaine " + w.w + " (" + dm(s) + " - " + dm(e) + ")"; }

}
function setQty(id, nq, kind){

  nq = Math.max(0, nq); if (nq === l.qty) return;
  snapshot();
  var d = nq - l.qty;
  l.qty = nq;
  if (kind === "entree") l.pend = Math.max(0, (l.pend || 0) - d);
  addLog(id, kind, d, nq);
  save(); renderBadge(); if (view === "stock") renderStock();
  toast((d > 0 ? "+" : "") + d + " · " + title(l) + " " + fmtShow(l.fmt) + " : " + nq, true);
}

  var st = S.settings, h = "";
  h += '<h2>Réglages</h2>';
  h += '<div class="set"><h3>Commande par mail</h3><div class="field"><label for="sto">Destinataire</label><input id="sto" type="email" inputmode="email" value="' + esc(st.to) + '" placeholder="adresse du fournisseur"></div>' +
    '<div class="field"><label for="scc">Copie</label><input id="scc" type="email" inputmode="email" value="' + esc(st.cc) + '"></div>' +
    '<div class="field"><label for="ssig">Signature</label><input id="ssig" value="' + esc(st.sig) + '"></div></div>';
  h += '<div class="set"><h3>Seuil de commande pour toutes les lignes sans seuil</h3><p>Il s\'applique seulement aux lignes dont le seuil est vide. Tu ajustes ensuite ligne par ligne.</p><div class="inline"><input id="sbulk" inputmode="numeric" placeholder="ex. 3" aria-label="Seuil"><button class="btn" type="button" data-act="bulk" style="flex:none">Appliquer</button></div></div>';
  var hasPin = !!lget(PINK);
  h += '<div class="set"><h3>Code d\'accès</h3><p>' + (hasPin ? 'Un code à 4 chiffres est demandé à chaque ouverture. Si tu l\'oublies, il faut vider les données du site, donc tout le stock est perdu : garde un export.' : 'Aucun code. N\'importe qui avec ce téléphone peut modifier le stock.') + '</p><div class="btns"><button class="btn" type="button" data-act="pinset">' + (hasPin ? 'Changer le code' : 'Mettre un code') + '</button>' + (hasPin ? '<button class="btn danger" type="button" data-act="pinoff">Retirer le code</button>' : '') + '</div></div>';
  h += '<div class="set"><h3>Sauvegarde</h3><p>Les chiffres sont gardés dans ce navigateur, sur cet appareil. Pour les passer du téléphone au PC : exporter ici, importer là.</p><div class="btns"><button class="btn" type="button" data-act="export">Exporter</button><label class="btn" style="text-align:center">Importer<input id="simp" type="file" accept="application/json,.json" hidden></label></div></div>';
  h += '<div class="set"><h3>Repartir de l\'inventaire du ' + esc(S.seed) + '</h3><p>Efface les quantités, les mouvements et les commandes enregistrés, et recharge la liste de départ.</p><button class="btn danger" type="button" data-act="reset" id="sreset">Tout remettre à zéro</button></div>';
  $("#main").innerHTML = h;
}

/* ---------- formulaire ---------- */
function openSheet(id){
  editId = id; var l = id ? byId(id) : null;
  $("#ft").textContent = l ? "Modifier la plaque" : "Nouvelle plaque";
  var mats = []; S.lines.forEach(function(x){ if (mats.indexOf(x.mat) < 0) mats.push(x.mat); });
  $("#matl").innerHTML = mats.map(function(m){ return '<option value="' + esc(m) + '">'; }).join("");
  $("#fmat").value = l ? l.mat : (F.mat || ""); $("#fep").value = l ? l.ep : ""; $("#fcoul").value = l ? l.coul : "";
  $("#ffmt").value = l ? l.fmt : ""; $("#fqty").value = l ? l.qty : ""; $("#fchu").value = l ? l.chu : "";
  $("#fseuil").value = l && l.seuil != null ? l.seuil : ""; $("#fnote").value = l ? l.note : "";
  $("#ferr").textContent = ""; $("#fdel").hidden = !l; $("#fdel").textContent = "Supprimer";
  $("#sheet").hidden = false; setTimeout(function(){ $(l ? "#fqty" : "#fmat").focus(); }, 50);
}
function closeSheet(){ $("#sheet").hidden = true; editId = null; }
$("#f").addEventListener("submit", function(e){
  e.preventDefault();
  var mat = $("#fmat").value.trim().toUpperCase(), coul = $("#fcoul").value.trim().toUpperCase(), fmt = $("#ffmt").value.trim().toLowerCase().replace(/\s+/g, "").replace("×", "x");
  if (!mat || !coul){ $("#ferr").textContent = "Matière et couleur sont obligatoires."; return; }
  var qty = Math.max(0, num($("#fqty").value, 0)), chu = Math.max(0, num($("#fchu").value, 0)), sv = $("#fseuil").value.trim();
  var seuil = sv === "" ? null : Math.max(0, num(sv, 0));
  snapshot();
  var l = editId ? byId(editId) : null;
  if (l){
    var old = l.qty;
    l.mat = mat; l.ep = $("#fep").value.trim().replace(".", ","); l.coul = coul; l.fmt = fmt; l.chu = chu; l.seuil = seuil; l.note = $("#fnote").value.trim(); l.qty = qty;
    if (qty !== old) addLog(l.id, "comptage", qty - old, qty);
  } else {
    l = {id:uid(), mat:mat, ep:$("#fep").value.trim().replace(".", ","), coul:coul, fmt:fmt, qty:qty, chu:chu, seuil:seuil, note:$("#fnote").value.trim(), pend:0};
    S.lines.push(l); if (qty) addLog(l.id, "comptage", qty, qty);
  }
  save(); closeSheet(); render(); toast("Enregistré", true);
});
$("#fclose").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", function(e){ if (e.target === $("#sheet")) closeSheet(); });
$("#fdel").addEventListener("click", function(){
  if ($("#fdel").textContent === "Supprimer"){ $("#fdel").textContent = "Confirmer la suppression"; return; }
  snapshot(); S.lines = S.lines.filter(function(x){ return x.id !== editId; }); save(); closeSheet(); render(); toast("Plaque supprimée", true);
});
$("#fab").addEventListener("click", function(){ openSheet(null); });

/* ---------- événements ---------- */
$("#nav").addEventListener("click", function(e){ var b = e.target.closest("button[data-v]"); if (!b) return; view = b.dataset.v; render(); window.scrollTo(0, 0); });
$("#main").addEventListener("click", function(e){
  var t = e.target, b;
  if ((b = t.closest("[data-d]"))){ var l = byId(b.dataset.id); setQty(b.dataset.id, l.qty + parseInt(b.dataset.d, 10), parseInt(b.dataset.d, 10) > 0 ? "entree" : "sortie"); return; }
  if ((b = t.closest("[data-edit]"))){ openSheet(b.dataset.edit); return; }
  if ((b = t.closest("[data-m]"))){ F.mat = b.dataset.m; renderStock(); return; }
  if ((b = t.closest("[data-low]"))){ F.low = !F.low; renderStock(); return; }
  if ((b = t.closest("[data-mode]"))){ C.mode = b.dataset.mode; renderCmd(); return; }
  if ((b = t.closest("[data-act]"))) act(b.dataset.act);
});
$("#main").addEventListener("input", function(e){
  if (e.target.id === "q"){ F.q = e.target.value; var p = e.target.selectionStart; renderStock(); var q = $("#q"); q.focus(); try { q.setSelectionRange(p, p); } catch (x) {} }
  else if (e.target.id === "cq"){ C.q = e.target.value; var p2 = e.target.selectionStart; renderCmd(); var c = $("#cq"); c.focus(); try { c.setSelectionRange(p2, p2); } catch (x) {} }
});
$("#main").addEventListener("change", function(e){
  var t = e.target;
  if (t.classList.contains("qi") && t.dataset.id){ setQty(t.dataset.id, num(t.value, byId(t.dataset.id).qty), "comptage"); if (view === "stock") renderStock(); return; }
  if (t.dataset.sel){ C.sel[t.dataset.sel] = t.checked; renderCmd(); return; }
  if (t.dataset.cq){ C.qty[t.dataset.cq] = Math.max(0, num(t.value, 1)); renderCmd(); return; }
  if (t.id === "sto"){ S.settings.to = t.value.trim(); save(); }
  else if (t.id === "scc"){ S.settings.cc = t.value.trim(); save(); }
  else if (t.id === "ssig"){ S.settings.sig = t.value; save(); }
  else if (t.id === "simp" && t.files && t.files[0]) importFile(t.files[0]);
});
$("#main").addEventListener("focusin", function(e){ if (e.target.classList && e.target.classList.contains("qi")) e.target.select(); });

function act(a){
  if (a === "pinset"){ showLock("new", "settings"); }
  else if (a === "pinoff"){ lset(PINK, ""); try { localStorage.removeItem(PINK); } catch (e) {} lset(NOPK, "1"); renderSet(); toast("Code retiré", false); }
  else if (a === "hint"){ S.hint = false; save(); renderStock(); }
  else if (a === "copy"){
    var txt = composeText(cmdChosen()), ta = $("#msg");
    var fb = function(){ ta.removeAttribute("readonly"); ta.focus(); ta.select(); toast("Sélectionné : copie à la main", false); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast("Texte copié", false); }, fb); else fb();
  }
  else if (a === "mail"){
    var urg = C.mode === "urgent", ch = cmdChosen(), w = isoWeek(Date.now()).w;
    var sub = (urg ? "COMMANDE URGENTE" : "Commande") + " Publimax - semaine " + w;
    var url = "mailto:" + encodeURIComponent(S.settings.to || "") + "?subject=" + encodeURIComponent(sub) + (S.settings.cc ? "&cc=" + encodeURIComponent(S.settings.cc) : "") + "&body=" + encodeURIComponent(composeText(ch));
    window.location.href = url;
  }
  else if (a === "place"){
    var items = cmdChosen(); if (!items.length) return;
    snapshot();
    S.orders.unshift({id:uid(), t:Date.now(), urgent:C.mode === "urgent", items:items.map(function(x){ return {id:x.l.id, lbl:label(x.l), qty:x.q}; })});
    items.forEach(function(x){ x.l.plan = 0; x.l.pend = (x.l.pend || 0) + x.q; delete C.sel[x.l.id]; delete C.qty[x.l.id]; });
    save(); render(); toast("Commande enregistrée : " + items.length + " ligne" + (items.length > 1 ? "s" : ""), true);
  }
  else if (a === "bulk"){
    var v = $("#sbulk").value.trim(); if (v === ""){ toast("Tape un seuil.", false); return; }
    snapshot(); var n = 0, s = Math.max(0, num(v, 0));
    S.lines.forEach(function(l){ if (l.seuil == null){ l.seuil = s; n++; } });
    save(); renderBadge(); toast(n + " lignes : seuil " + s, true);
  }
  else if (a === "export"){
    var blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"}), u = URL.createObjectURL(blob), a2 = document.createElement("a");
    a2.href = u; a2.download = "stock_publimax_" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a2); a2.click(); a2.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 2000);
  }
  else if (a === "reset"){
    var b = $("#sreset");
    if (b.textContent !== "Confirmer : tout effacer"){ b.textContent = "Confirmer : tout effacer"; return; }
    S = seedState(); snap = null; save(); view = "stock"; render(); toast("Liste de départ rechargée", false);
  }
}
function importFile(f){
  var r = new FileReader();
  r.onload = function(){
    try {
      var o = JSON.parse(r.result);
      if (!o || !Array.isArray(o.lines)) throw new Error("format");
      snapshot(); S = o; if (!S.log) S.log = []; if (!S.orders) S.orders = []; if (!S.settings) S.settings = {to:"", cc:"", sig:"Publimax"};
      save(); render(); toast("Sauvegarde importée : " + S.lines.length + " lignes", true);
    } catch (e) { toast("Fichier non reconnu.", false); }
  };
  r.readAsText(f);
}

/* ---------- code d'acces (confort, pas de la securite : le code est lisible dans le fichier) ---------- */
var PINK = "publimax_stock_pin", NOPK = "publimax_stock_nopin", SESK = "publimax_stock_ok";
var lockMode = "ask", lockTmp = "", lockFrom = "boot", started = false;
function lget(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lset(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function sget(){ try { return sessionStorage.getItem(SESK); } catch (e) { return null; } }
function sset(){ try { sessionStorage.setItem(SESK, "1"); } catch (e) {} }
function hashPin(p){ var h = 5381, t = "publimax|" + p + "|stock"; for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h >>> 0); }
function startApp(){ if (started) return; started = true; S = load(); save(); render(); }
function showLock(mode, from){
  lockMode = mode; lockFrom = from; lockTmp = "";
  var li = $("#li"), ls = $("#ls");
  li.value = ""; $("#lm").textContent = "";
  $("#lt").textContent = mode === "ask" ? "Code d'accès" : "Crée un code à 4 chiffres";
  if (mode === "new"){ ls.hidden = false; ls.textContent = from === "boot" ? "Continuer sans code" : "Annuler"; } else ls.hidden = true;
  $("#lock").hidden = false; setTimeout(function(){ li.focus(); }, 50);
}
function unlock(){ $("#lock").hidden = true; startApp(); if (view === "set") renderSet(); }
$("#li").addEventListener("input", function(){
  var li = $("#li"); li.value = li.value.replace(/[^0-9]/g, "").slice(0, 4);
  if (li.value.length < 4) return;
  var v = li.value; li.value = "";
  if (lockMode === "ask"){
    if (hashPin(v) === lget(PINK)){ sset(); unlock(); } else $("#lm").textContent = "Code faux.";
  } else if (lockMode === "new"){
    lockTmp = v; lockMode = "confirm"; $("#lt").textContent = "Confirme le code"; $("#lm").textContent = ""; $("#ls").textContent = "Annuler"; $("#ls").hidden = false;
  } else {
    if (v === lockTmp){ lset(PINK, hashPin(v)); try { localStorage.removeItem(NOPK); } catch (e) {} sset(); unlock(); toast("Code enregistré", false); }
    else { lockMode = "new"; lockTmp = ""; $("#lt").textContent = "Crée un code à 4 chiffres"; $("#lm").textContent = "Les deux codes ne correspondent pas."; }
  }
});
$("#ls").addEventListener("click", function(){
  if (lockFrom === "boot" && lockMode === "new" && !lockTmp){ lset(NOPK, "1"); unlock(); return; }
  if (lockFrom === "boot"){ showLock("new", "boot"); return; }
  $("#lock").hidden = true;
});
(function boot(){
  if (lget(PINK)){ if (sget()) startApp(); else showLock("ask", "boot"); }
  else if (lget(NOPK)) startApp();
  else showLock("new", "boot");
})();
</script>
