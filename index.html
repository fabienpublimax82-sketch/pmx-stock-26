<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00829C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Stock plaques Publimax</title>
<style>
/* Charte Publimax : turquoise 0,130,156 / gris 119,116,113 / Arial. Mobile d'abord, barre du bas au pouce, colonne centrée sur PC. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --sunk:#E8EEF0; --fg:#1B2529; --muted:#5F6B70; --line:#D3DCDF;
  --accent:#00829C; --accent-ink:#FFFFFF; --accent-soft:#DCF0F4; --gris:#777471;
  --bad:#B3382C; --bad-soft:#F8E4E1; --warn:#8F5309; --warn-soft:#FBEFD9; --good:#2B7A4B; --good-soft:#E3F2E9;
  --font:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
      --bg:#101719; --surface:#182124; --sunk:#0E1416; --fg:#E4ECEE; --muted:#96A5AA; --line:#2A383C;
      --accent:#3DB8D1; --accent-ink:#06222A; --accent-soft:#123037;
      --bad:#EE8B80; --bad-soft:#3A1B18; --warn:#E3A850; --warn-soft:#33260F; --good:#5CC089; --good-soft:#14301F;
      color-scheme:dark;
    }
  :root:not([data-theme="light"]) .badge.chu{background:var(--sunk);color:var(--muted)}
  :root:not([data-theme="light"]) .pl{--pe:rgba(255,255,255,.35);--pr:rgba(255,255,255,.3)}
  :root:not([data-theme="light"]) .pl.glass{--pe:rgba(150,200,225,.5);--pr:rgba(150,200,225,.7)}
  :root:not([data-theme="light"]) .pl.smoke{background:linear-gradient(135deg,rgba(190,190,200,.30),rgba(190,190,200,.5));--pe:rgba(200,200,210,.5);--pr:rgba(200,200,210,.6)}
  }
:root[data-theme="dark"]{
    --bg:#101719; --surface:#182124; --sunk:#0E1416; --fg:#E4ECEE; --muted:#96A5AA; --line:#2A383C;
    --accent:#3DB8D1; --accent-ink:#06222A; --accent-soft:#123037;
    --bad:#EE8B80; --bad-soft:#3A1B18; --warn:#E3A850; --warn-soft:#33260F; --good:#5CC089; --good-soft:#14301F;
    color-scheme:dark;
  }
:root[data-theme="dark"] .badge.chu{background:var(--sunk);color:var(--muted)}
:root[data-theme="dark"] .pl{--pe:rgba(255,255,255,.35);--pr:rgba(255,255,255,.3)}
:root[data-theme="dark"] .pl.glass{--pe:rgba(150,200,225,.5);--pr:rgba(150,200,225,.7)}
:root[data-theme="dark"] .pl.smoke{background:linear-gradient(135deg,rgba(190,190,200,.30),rgba(190,190,200,.5));--pe:rgba(200,200,210,.5);--pr:rgba(200,200,210,.6)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
header.top{background:#FFFFFF;border-bottom:3px solid var(--accent);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top img{height:36px;width:auto;display:block;max-width:60vw}
header.top .ttl{font-size:13px;font-weight:bold;color:var(--gris);text-transform:uppercase;letter-spacing:.08em;text-align:right}
main{max-width:860px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar button{flex:1;min-width:0;padding:12px 4px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font-size:13px;font-weight:bold}
nav.bar button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
nav.bar .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px}
@media (min-width:760px){
  nav.bar{position:static;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:0 16px}
  nav.bar button{flex:0 0 auto;padding:12px 22px;border-top:0;border-bottom:3px solid transparent;font-size:14px}
  nav.bar button[aria-current="page"]{border-bottom-color:var(--accent)}
  main{padding-bottom:40px}
}
h2{font-size:18px;margin:4px 0 10px}
.hint{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;margin-bottom:12px;background:var(--accent-soft);border-radius:6px;font-size:14px}
.hint button{flex:none;background:none;border:0;color:var(--accent);font-weight:bold;padding:2px 6px}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.search{width:100%;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 13px;background:var(--surface);border:1px solid var(--line);border-radius:18px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:bold}
.chip.alert[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.grp{margin:18px 0 6px;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.1em;color:var(--gris)}
.card{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;background:var(--surface);background:color-mix(in srgb,var(--tc,var(--surface)) 14%,var(--surface));color:var(--fg);border:1px solid var(--line);border-left:6px solid var(--tc,var(--line));border-radius:8px}
.card.chute{border-top-style:dashed;border-right-style:dashed;border-bottom-style:dashed}
.card.low{border:2px solid var(--bad);border-left:6px solid var(--tc,var(--bad))}
.card .info{flex:1;min-width:0;cursor:pointer}
.card .t{font-weight:bold;overflow-wrap:anywhere}
.card .s{font-size:13px;color:var(--muted)}
.badge{display:inline-block;margin:4px 5px 0 0;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:bold}
.badge.bad{background:var(--bad);color:#fff}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.chu{background:rgba(0,0,0,.14);color:#1B2529}
.fam{display:inline-block;min-width:34px;margin-right:7px;padding:1px 5px;border-radius:4px;border:1px solid rgba(0,0,0,.3);font-size:11px;font-weight:bold;text-align:center;vertical-align:1px;letter-spacing:.03em}
.qty{flex:none;display:flex;align-items:center;gap:6px}
.qty button{width:46px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1;font-weight:bold;color:var(--accent)}
.qty button:active{background:var(--accent-soft)}
.qty input{width:62px;height:46px;text-align:center;font-size:20px;font-weight:bold;background:var(--bg);border:1px solid var(--line);border-radius:8px;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fabs{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:8px}
.fabs[hidden]{display:none}
.fab{padding:14px 18px;border:2px solid var(--accent);border-radius:28px;background:var(--accent);color:var(--accent-ink);font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.fab.alt{background:var(--surface);color:var(--accent)}
@media (min-width:760px){.fabs{bottom:24px}}
.hb{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid #C9D3D6;border-radius:8px;background:#FFFFFF;color:#777471}
.ib:active{background:#E8EEF0}
@media (max-width:560px){header.top .ttl{display:none}}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;text-transform:capitalize}
.calhd .btn{flex:none;padding:8px 16px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.calg .wd{text-align:center;font-size:12px;font-weight:bold;color:var(--muted)}
.cal-d{min-height:46px;padding:4px 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:bold}
.cal-d.today{border:2px solid var(--accent)}
.cal-d.sel{background:var(--accent);color:var(--accent-ink)}
.cal-d .dots{display:flex;gap:3px;justify-content:center;margin-top:3px;min-height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.s{background:var(--bad)} .dot.e{background:var(--good)} .dot.o{background:var(--warn)} .dot.c{background:var(--muted)}
.cal-d.sel .dot{box-shadow:0 0 0 1px #fff}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:normal;font-size:14px;color:var(--fg)}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:11px 8px;background:var(--surface);border:0;border-right:1px solid var(--line);font-weight:bold;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.urg[aria-pressed="true"]{background:var(--bad);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.row .info{flex:1;min-width:0}
.row .qi{width:64px;height:42px;text-align:center;font-size:18px;font-weight:bold;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.msg{width:100%;min-height:200px;margin:10px 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font:14px/1.45 Consolas,Menlo,monospace}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 140px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-weight:bold}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.urg{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
details.wk{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.wk>summary{padding:12px;cursor:pointer;font-weight:bold}
details.wk .sum{display:block;font-weight:normal;font-size:13px;color:var(--muted);margin-top:2px}
.ev{display:flex;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.ev .d{flex:none;width:76px;color:var(--muted);font-size:12px}
.ev .l{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .v{flex:none;font-weight:bold;font-variant-numeric:tabular-nums}
.ev .v.neg{color:var(--bad)} .ev .v.pos{color:var(--good)} .ev .v.cmd{color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:bold;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.set h3{margin:0 0 10px;font-size:15px}
.set p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{align-items:center}.panel{border-radius:12px}}
.panel h2{margin:0 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;max-width:92vw;padding:11px 16px;background:#1B2529;color:#fff;border-radius:8px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:#7FD6E8;font-weight:bold;padding:2px 4px}
@media (min-width:760px){.toast{bottom:28px}}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.lock[hidden]{display:none}
.lock h2{margin:0;font-size:20px}
.lock .li{width:11em;max-width:100%;padding:14px;text-align:center;font-size:30px;letter-spacing:.4em;background:var(--surface);border:2px solid var(--accent);border-radius:10px}
.lock .lm{min-height:20px;font-size:14px;color:var(--bad)}
.lock .ls{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px}
.instbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:bold}
.instbar[hidden]{display:none}
.instbar button{flex:none;padding:9px 16px;border:0;border-radius:6px;background:#fff;color:#00829C;font-weight:bold}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ph{position:relative;width:76px;height:76px;border-radius:6px;background:var(--sunk) center/cover no-repeat;border:1px solid var(--line);cursor:pointer}
.ph .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;padding:0;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:bold;line-height:1}
.locrow{display:flex;gap:6px;margin-bottom:6px}
.locrow select{flex:1 1 0;min-width:0;padding:10px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.locrow input{flex:0 0 58px;width:58px;padding:10px 6px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.locrow .lc{flex:0 0 64px}
.tag{display:inline-block;margin:3px 5px 0 0;padding:0 8px;border-radius:10px;font-size:12px;font-weight:bold;background:rgba(127,127,127,.25)}
.seg2{display:flex;gap:6px;margin-bottom:10px}
#pv{background:rgba(0,0,0,.85);align-items:center}
#pv img{max-width:96vw;max-height:92vh;object-fit:contain}
#sh2 .panel textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
nav.bar button{font-size:12px;padding:12px 2px}
nav.bar .n[hidden]{display:none}
.card .qty{gap:4px}
.card .qty button{width:40px;height:44px;font-size:22px}
.card .qty input{width:52px;height:44px;font-size:19px}
.pl{--pe:rgba(0,0,0,.35);--pr:rgba(0,0,0,.2);flex:none;width:46px;height:30px;border-radius:3px;margin-bottom:var(--th,4px);box-shadow:0 var(--th,4px) 0 var(--pe),inset 0 0 0 1px var(--pr)}
.pl.glass{background:linear-gradient(135deg,transparent 0 36%,rgba(140,185,210,.35) 44% 56%,transparent 64%);--pe:rgba(110,155,180,.45);--pr:rgba(80,115,135,.6)}
.pl.smoke{background:linear-gradient(135deg,rgba(40,40,45,.38),rgba(40,40,45,.55));--pe:rgba(60,60,65,.5);--pr:rgba(40,40,45,.6)}
.row .pl{margin-right:2px}
.grp.mc{padding:5px 10px;border-left:6px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,var(--surface));color:var(--fg);border-radius:4px}
.chip.mc{border-left:6px solid var(--tc,var(--line))}
</style>
</head>

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function uid(){ uidN++; return "l" + Date.now().toString(36) + uidN + Math.random().toString(36).slice(2,5); }
function num(v, def){ var n = parseInt(String(v).replace(/[^0-9\-]/g, ""), 10); return isNaN(n) ? def : n; }

function seedState(){
  var lines = [];
  SEED.forEach(function(r){

function migrate(o){
  var add = [];
  o.lines.forEach(function(l){
    if (l.plan == null) l.plan = 0; if (l.pend == null) l.pend = 0; if (l.fam == null) l.fam = ""; if (l.chute == null) l.chute = false;
    if (l.chu > 0 && !l.chute){ add.push({id:uid(), mat:l.mat, ep:l.ep, coul:l.coul, fmt:"", qty:l.chu, seuil:null, note:"chute (taille a preciser)", pend:0, plan:0, fam:l.fam, chute:true, sup:l.sup || "", loc:[]}); }
    l.chu = 0; if (l.sup == null) l.sup = ""; if (!l.loc) l.loc = [];
  });
  if (!o.sups) o.sups = []; if (!o.zones) o.zones = ["Zone 6", "Zone 8", "Numérique"]; if (!o.matDef) o.matDef = {}; if (!o.deliv) o.deliv = [];
  if (!o.log) o.log = []; if (!o.orders) o.orders = []; if (!o.settings) o.settings = {to:"", cc:"", sig:"Publimax"};
  o.lines = o.lines.concat(add); o.ver = 3; return o;
}
function load(){
  try { var raw = localStorage.getItem(KEY); if (raw){ var o = JSON.parse(raw); if (o && o.lines) return migrate(o); } } catch (e) {}
  return seedState();

/* couleurs de la feuille d'inventaire : une teinte par groupe */
function colorOf(l){
  var m = l.mat, c = (l.coul || "").toUpperCase(), n = (l.note || "").toUpperCase();
  if (m === "PVC") return c.indexOf("NOIR") >= 0 ? "#A4A5AA" : (c.indexOf("ROUGE") >= 0 ? "#EAC6C9" : "#E2E3E6");
  if (m === "PVC KOMACEL") return "#B0B3B8";
  if (m === "MPLI") return "#D9A13A";
  if (m === "PETG") return "#EDDB9C";
  if (m === "PC" || m === "PC UV") return "#CDBFE2";
  if (m === "PMMA") return c.indexOf("DIFFUSANT") >= 0 ? "#E6CFCC" : (c.indexOf("TRANSPARENT") >= 0 ? "#F1E7C4" : (c.indexOf("OPAQUE") >= 0 ? "#EEDDA0" : "#EBB445"));
  if (m === "ALU") return c.indexOf("NOIR") >= 0 ? "#8C8D92" : "#B9BABF";
  if (m === "CSTEEL") return "#C6D2D6";
  if (m === "ALU COMPOSITE"){
    if (c.indexOf("EBASIC") >= 0) return "#CBD6CE";
    if (n.indexOf("COMP2D2") >= 0) return "#8FA9D8";
    if (n.indexOf("D2") >= 0) return "#9DB5DD";
    if (n.indexOf("D3") >= 0) return "#BFCEE9";
    return "#ADC1E5";
  }
  return "#D9E1E3";
}

function plain(x){ x = String(x || "").toUpperCase(); try { x = x.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) {} return x; }
function plHtml(l){
  var c = plain(l.coul), cls = "", bg = "", m = c.match(/RAL\s*(\d{4})(?:\s*\/\s*RAL\s*(\d{4}))?/), f = FAM[l.fam];
  if (m){ var a = RAL[m[1]] || "#B9BABF", b = m[2] ? (RAL[m[2]] || "#B9BABF") : ""; bg = b ? "linear-gradient(135deg," + a + " 50%," + b + " 50%)" : a; }
  else if (c.indexOf("TRANSPARENT") >= 0 || c.indexOf("TRAINC") >= 0 || c.indexOf("INCOLORE") >= 0) cls = " glass";
  else if (c.indexOf("FUME") >= 0) cls = " smoke";
  else if (c.indexOf("DIFFUSANT") >= 0) bg = "radial-gradient(circle at 40% 35%,#fff,#E9EEF2 70%,#D5DCE2)";
  else if (c.indexOf("OPAQUE") >= 0) bg = "#F6F6F4";
  else if (c.indexOf("BROSSE") >= 0) bg = c.indexOf("OR") >= 0 ? "repeating-linear-gradient(90deg,#CDAF63 0 2px,#DCC27F 2px 4px)" : "repeating-linear-gradient(90deg,#C4C7CB 0 2px,#DCDFE2 2px 4px)";
  else if (c.indexOf("MIRROR GOLD") >= 0) bg = "linear-gradient(135deg,#F3DFA0,#B8923A 55%,#F3DFA0)";
  else if (c.indexOf("MIRROR") >= 0) bg = "linear-gradient(135deg,#FFFFFF,#9AA1A8 55%,#F2F4F5)";
  else if (c.indexOf("BRUT") >= 0) bg = "linear-gradient(135deg,#D2D5D8,#A9ADB2)";
  else if (c.indexOf("EBASIC") >= 0) bg = "#CBD6CE";
  else if (l.fam === "B&W") bg = "linear-gradient(135deg,#111 50%,#fff 50%)";
  else if (f) bg = f[0];
  else if (c.indexOf("NOIR") >= 0) bg = "#1E1E20";
  else if (c.indexOf("ROUGE") >= 0) bg = "#C7373D";
  else if (c.indexOf("BLANC") >= 0) bg = "#F7F7F5";
  else bg = "#D9DEE1";
  var th = Math.max(2, Math.min(6, Math.round((parseFloat(String(l.ep || "3").replace(",", ".")) || 3) / 4) + 2));
  return '<div class="pl' + cls + '" style="--th:' + th + 'px' + (bg ? ';background:' + bg : '') + '"></div>';
}

function under(l){ return !l.chute && l.seuil != null && l.qty <= l.seuil; }
function needs(l){ return !l.chute && ((l.plan || 0) > 0 || (l.seuil != null && (l.qty + (l.pend || 0)) <= l.seuil)); }
function suggest(l){ if ((l.plan || 0) > 0) return l.plan; return Math.max(1, (l.seuil || 0) - (l.qty + (l.pend || 0))); }
function matRank(m){ var i = MATORDER.indexOf(m); return i < 0 ? 99 : i; }
function sortLines(a, b){
  return (matRank(a.mat) - matRank(b.mat)) || a.mat.localeCompare(b.mat) ||
    ((parseFloat(String(a.ep).replace(",", ".")) || 0) - (parseFloat(String(b.ep).replace(",", ".")) || 0)) ||
    a.coul.localeCompare(b.coul, "fr", {numeric:true}) || ((a.chute ? 1 : 0) - (b.chute ? 1 : 0)) || String(a.fmt).localeCompare(String(b.fmt), "fr", {numeric:true});
}
function byId(id){ return S.lines.filter(function(l){ return l.id === id; })[0]; }

/* ---------- semaines ---------- */
function isoWeek(t){
  var x = new Date(t), d = new Date(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()));
  var day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  var y = d.getUTCFullYear(), w = Math.ceil((((d - Date.UTC(y, 0, 1)) / 86400000) + 1) / 7);
  return {y:y, w:w};
}
function weekStart(t){ var d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() || 7) - 1)); return d; }
function dm(t){ return new Date(t).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit"}); }
function dfull(t){ return new Date(t).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric"}); }
function hm(t){ return new Date(t).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}); }
function wkLabel(t){ var w = isoWeek(t), s = weekStart(t), e = new Date(s); e.setDate(e.getDate() + 6); return "Semaine " + w.w + " (" + dm(s) + " - " + dm(e) + ")"; }

function snapshot(){ snap = JSON.stringify(S); }
function addLog(id, kind, d, q){
  var l = byId(id), now = Date.now(), last = S.log[0];
  if (last && last.id === id && last.k === kind && kind !== "comptage" && now - last.t < 60000){ last.d += d; last.q = q; last.t = now; if (last.d === 0) S.log.shift(); return; }
  S.log.unshift({t:now, id:id, lbl:l ? label(l) : "", k:kind, d:d, q:q});
}
function setQty(id, nq, kind){
  var l = byId(id); if (!l) return;
  nq = Math.max(0, nq); if (nq === l.qty) return;
  snapshot();
  var d = nq - l.qty;
  l.qty = nq;
  if (kind === "entree") l.pend = Math.max(0, (l.pend || 0) - d);
  addLog(id, kind, d, nq);
  save(); renderBadge(); if (view === "stock") renderStock();
  toast((d > 0 ? "+" : "") + d + " · " + title(l) + " " + fmtShow(l.fmt) + " : " + nq, true);
}
function toast(msg, undo){
  $("#tmsg").textContent = msg; $("#tundo").hidden = !undo; $("#toast").hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ $("#toast").hidden = true; }, undo ? 6000 : 3500);
}
$("#tundo").addEventListener("click", function(){
  if (!snap) return;
  S = migrate(JSON.parse(snap)); snap = null; save(); $("#toast").hidden = true; renderBadge(); render(); if (!$("#sh2").hidden){ if (DV && delivById(DV.id)) renderDeliv(); else closeSh2(); }
});

/* ---------- vues ---------- */
function renderBadge(){
  var n = S.lines.filter(needs).length, b = $("#navn");
  b.hidden = !n; b.textContent = n;
  var m = (S.deliv || []).filter(function(d){ return dStatus(d) !== "done" || openRes(d) > 0; }).length, c = $("#navl");
  c.hidden = !m; c.textContent = m;
}
function render(){
  var tabs = document.querySelectorAll("#nav button");
  for (var i = 0; i < tabs.length; i++){ if (tabs[i].dataset.v === view) tabs[i].setAttribute("aria-current", "page"); else tabs[i].removeAttribute("aria-current"); }
  $("#fabs").hidden = view !== "stock";
  if (view === "stock") renderStock(); else if (view === "cmd") renderCmd(); else if (view === "liv") renderLiv(); else if (view === "fou") renderFou(); else if (view === "wk") renderWk(); else renderSet();
  renderBadge();
}
function lineText(l){ return (label(l) + " " + l.note + " " + supName(l.sup) + " " + (l.loc || []).map(locTxt).join(" ")).toLowerCase(); }
function cardHtml(l){
  var b = "";

  if ((l.plan || 0) > 0) b += '<span class="badge warn">A commander : ' + l.plan + '</span>';
  if (l.pend > 0) b += '<span class="badge warn">En commande : ' + l.pend + '</span>';
  if (l.chute) b += '<span class="badge chu">Chute</span>';
  var tg = (l.loc || []).map(function(o){ return '<span class="tag">' + esc(locTxt(o)) + '</span>'; }).join("");

    (l.fmt ? esc(fmtShow(l.fmt)) : (l.chute ? "taille à préciser" : "")) + (l.seuil != null ? ' · seuil ' + l.seuil : '') + (l.sup ? ' · ' + esc(supName(l.sup)) : '') + (l.note ? ' · ' + esc(l.note) : '') + '</div>' + (tg || b ? '<div>' + tg + b + '</div>' : '') + '</div>' +
    '<div class="qty"><button type="button" data-d="-1" data-id="' + l.id + '" aria-label="Retirer une plaque">−</button>' +
    '<input class="qi" inputmode="numeric" data-id="' + l.id + '" value="' + l.qty + '" aria-label="Quantité">' +
    '<button type="button" data-d="1" data-id="' + l.id + '" aria-label="Ajouter une plaque">+</button></div></article>';
}

function cmdItems(){
  var ls = S.lines.slice().sort(sortLines);
  if (C.mode === "week") return ls.filter(needs);
  var q = C.q.toLowerCase();
  return ls.filter(function(l){ return !l.chute && (!q || (label(l) + " " + l.note).toLowerCase().indexOf(q) >= 0); })
    .sort(function(a, b){ return (needs(b) ? 1 : 0) - (needs(a) ? 1 : 0); });
}
function cmdSel(l){ var v = C.sel[l.id]; return v == null ? (C.mode === "week") : v; }
function cmdQty(l){ var v = C.qty[l.id]; return v == null ? (C.mode === "week" ? suggest(l) : Math.max(1, suggest(l))) : v; }
function composeText(items, sid){
  var urg = C.mode === "urgent", now = Date.now(), w = isoWeek(now).w, t = [];
  t.push(urg ? "COMMANDE URGENTE - Publimax" : "COMMANDE - Publimax");
  if (sid) t.push("Fournisseur : " + supName(sid));
  t.push("Semaine " + w + " - " + dfull(now)); t.push("");
  items.forEach(function(x){ t.push("- " + label(x.l) + " : " + x.q + " plaque" + (x.q > 1 ? "s" : "")); });
  t.push("");
  if (urg) t.push("Livraison souhaitée : au plus vite.");
  t.push("Merci de confirmer la disponibilité et le délai."); t.push(S.settings.sig || "");

}
function cmdChosenFor(k){

}

function renderWk(){
  var ev = [], groups = {}, keys = [], h = "";
  S.log.forEach(function(e){ ev.push({t:e.t, e:e}); });
  S.orders.forEach(function(o){ ev.push({t:o.t, o:o}); });
  ev.sort(function(a, b){ return b.t - a.t; });
  ev.forEach(function(x){
    var w = isoWeek(x.t), k = w.y + "-" + (w.w < 10 ? "0" : "") + w.w;
    if (!groups[k]){ groups[k] = {t:x.t, items:[]}; keys.push(k); }
    groups[k].items.push(x);
  });
  h += '<h2>Semaines</h2><p style="font-size:13px;color:var(--muted);margin-top:0">Chaque mouvement est empilé par semaine. La commande de fin de semaine se prépare dans « Commande ».</p>';
  if (!keys.length) h += '<div class="empty">Rien pour l\'instant. Les + / − et les commandes apparaissent ici.</div>';
  keys.forEach(function(k, idx){
    var g = groups[k], out = 0, inn = 0, nc = 0;
    g.items.forEach(function(x){ if (x.o) nc++; else if (x.e.k === "sortie") out += -x.e.d; else if (x.e.k === "entree") inn += x.e.d; });

      if (x.o){
        var tot = x.o.items.reduce(function(a, i){ return a + i.qty; }, 0);
        h += '<div class="ev"><div class="d">' + dm(x.t) + ' ' + hm(x.t) + '</div><div class="l"><b>' + (x.o.urgent ? "Commande URGENTE" : "Commande") + '</b><br>' + x.o.items.map(function(i){ return esc(i.lbl) + ' : ' + i.qty; }).join("<br>") + '</div><div class="v cmd">' + tot + '</div></div>';
      } else {

      }

    h += '</details>';

  $("#main").innerHTML = h;
}

/* ---------- formulaire ---------- */

$("#ftype").addEventListener("change", formLayout);
$("#fsrc").addEventListener("change", function(){

  $("#fmat").value = x.mat; $("#fep").value = x.ep; $("#fcoul").value = x.coul; $("#ffam").value = x.fam || ""; $("#fretire").checked = true; $("#fsup").value = x.sup || "";

function closeSheet(){ $("#sheet").hidden = true; editId = null; }
$("#f").addEventListener("submit", function(e){
  e.preventDefault();

  var mat = $("#fmat").value.trim().toUpperCase(), coul = $("#fcoul").value.trim().toUpperCase(), fmt = $("#ffmt").value.trim().toLowerCase().replace(/\s+/g, "").replace("×", "x");

  var qty = Math.max(0, num($("#fqty").value, isCh && !editId ? 1 : 0)), sv = $("#fseuil").value.trim();
  var seuil = (isCh || sv === "") ? null : Math.max(0, num(sv, 0));

    if (qty !== old) addLog(l.id, "comptage", qty - old, qty);

/* ---------- photos (IndexedDB, compressees) ---------- */
var idbP = null;
function idb(){
  if (idbP) return idbP;
  idbP = new Promise(function(res, rej){
    var r = indexedDB.open("publimax_stock_photos", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("p", {keyPath:"id"}); };
    r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
  });
  return idbP;
}
function photoPut(blob){
  var id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction("p", "readwrite"); tx.objectStore("p").put({id:id, blob:blob}); tx.oncomplete = function(){ res(id); }; tx.onerror = function(){ rej(tx.error); }; }); });
}
function photoGet(id){
  return idb().then(function(db){ return new Promise(function(res, rej){ var r = db.transaction("p").objectStore("p").get(id); r.onsuccess = function(){ res(r.result ? r.result.blob : null); }; r.onerror = function(){ rej(r.error); }; }); });
}
function photoDel(id){
  if (URLS[id]){ try { URL.revokeObjectURL(URLS[id]); } catch (e) {} delete URLS[id]; }
  return idb().then(function(db){ return new Promise(function(res){ var tx = db.transaction("p", "readwrite"); tx.objectStore("p").delete(id); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ res(); }; }); }).catch(function(){});
}
function photoClear(){
  Object.keys(URLS).forEach(function(k){ try { URL.revokeObjectURL(URLS[k]); } catch (e) {} }); URLS = {};
  return idb().then(function(db){ return new Promise(function(res){ var tx = db.transaction("p", "readwrite"); tx.objectStore("p").clear(); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ res(); }; }); }).catch(function(){});
}
function photoURL(id){
  if (URLS[id]) return Promise.resolve(URLS[id]);
  return photoGet(id).then(function(b){ if (!b) return ""; URLS[id] = URL.createObjectURL(b); return URLS[id]; });
}
function hydrate(root){
  var els = root.querySelectorAll("[data-ph]");
  for (var i = 0; i < els.length; i++){ (function(el){ photoURL(el.dataset.ph).then(function(u){ if (u) el.style.backgroundImage = 'url("' + u + '")'; }); })(els[i]); }
}
function shrink(file){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var m = 1280, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, m / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(function(b){ URL.revokeObjectURL(u); if (b) res(b); else rej(new Error("toBlob")); }, "image/jpeg", 0.72);
    };
    im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error("img")); };
    im.src = u;
  });
}

/* ---------- verrouiller ---------- */
$("#blk").addEventListener("click", function(){
  if (lget(PINK)){ try { sessionStorage.removeItem(SESK); } catch (e) {} showLock("ask", "boot"); }
  else { toast("Crée d'abord un code pour pouvoir verrouiller", false); showLock("new", "settings"); }
});
/* ---------- calendrier ---------- */
var CAL = {y:0, m:0, sel:""};
function p2(n){ return (n < 10 ? "0" : "") + n; }
function dk(t){ var d = new Date(t); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function calMap(){
  var m = {};
  S.log.forEach(function(e){ var k = dk(e.t); (m[k] = m[k] || []).push({t:e.t, e:e}); });
  S.orders.forEach(function(o){ var k = dk(o.t); (m[k] = m[k] || []).push({t:o.t, o:o}); });
  return m;
}
function evHtml(x){
  if (x.o){
    var tot = x.o.items.reduce(function(a, i){ return a + i.qty; }, 0);
    return '<div class="ev"><div class="d">' + hm(x.t) + '</div><div class="l"><b>' + (x.o.urgent ? "Commande URGENTE" : "Commande") + '</b><br>' + x.o.items.map(function(i){ return esc(i.lbl) + ' : ' + i.qty; }).join("<br>") + '</div><div class="v cmd">' + tot + '</div></div>';
  }
  var e = x.e, cls = e.k === "sortie" ? "neg" : (e.k === "entree" ? "pos" : ""), nm = e.k === "comptage" ? "comptage" : (e.k === "entree" ? "entrée" : "sortie");
  return '<div class="ev"><div class="d">' + hm(x.t) + '</div><div class="l">' + esc(e.lbl) + '<br><span style="color:var(--muted);font-size:12px">' + nm + ' · reste ' + e.q + '</span></div><div class="v ' + cls + '">' + (e.d > 0 ? "+" : "") + e.d + '</div></div>';
}
function renderCal(){
  var map = calMap(), first = new Date(CAL.y, CAL.m, 1), start = (first.getDay() || 7) - 1, days = new Date(CAL.y, CAL.m + 1, 0).getDate(), today = dk(Date.now());
  var h = '<h2>Calendrier</h2><div class="calhd"><button class="btn" type="button" data-cal="-1" aria-label="Mois précédent">‹</button><b>' + esc(first.toLocaleDateString("fr-FR", {month:"long", year:"numeric"})) + '</b><button class="btn" type="button" data-cal="1" aria-label="Mois suivant">›</button></div><div class="calg">';
  ["L", "M", "M", "J", "V", "S", "D"].forEach(function(d){ h += '<div class="wd">' + d + '</div>'; });
  for (var i = 0; i < start; i++) h += '<div></div>';
  for (var d = 1; d <= days; d++){
    var k = CAL.y + "-" + p2(CAL.m + 1) + "-" + p2(d), ev = map[k] || [], f = {s:0, e:0, o:0, c:0};
    ev.forEach(function(x){ if (x.o) f.o = 1; else if (x.e.k === "sortie") f.s = 1; else if (x.e.k === "entree") f.e = 1; else f.c = 1; });
    h += '<button type="button" class="cal-d' + (k === today ? " today" : "") + (k === CAL.sel ? " sel" : "") + '" data-day="' + k + '">' + d + '<div class="dots">' + (f.s ? '<span class="dot s"></span>' : '') + (f.e ? '<span class="dot e"></span>' : '') + (f.o ? '<span class="dot o"></span>' : '') + (f.c ? '<span class="dot c"></span>' : '') + '</div></button>';
  }
  h += '</div><p style="font-size:12px;color:var(--muted);margin:0 0 10px">Rouge : sorties · vert : entrées · orange : commandes · gris : comptages</p>';
  var evs = (map[CAL.sel] || []).slice().sort(function(a, b){ return b.t - a.t; });
  var sp = CAL.sel.split("-");
  h += '<h3 style="margin:6px 0">' + esc(new Date(+sp[0], +sp[1] - 1, +sp[2]).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"})) + '</h3>';
  h += evs.length ? evs.map(evHtml).join("") : '<div class="empty">Rien ce jour-là.</div>';
  h += '<div class="btns" style="margin-top:12px"><button class="btn" type="button" data-caltoday="1">Aujourd\'hui</button><button class="btn" type="button" data-calweek="1">Par semaine</button><button class="btn main" type="button" data-calclose="1">Fermer</button></div>';
  $("#calp").innerHTML = h;
}
function openCal(){ var n = new Date(); CAL.y = n.getFullYear(); CAL.m = n.getMonth(); CAL.sel = dk(n); renderCal(); $("#cal").hidden = false; }
$("#bcal").addEventListener("click", openCal);
$("#cal").addEventListener("click", function(e){
  var t = e.target, b;
  if (t === $("#cal") || t.closest("[data-calclose]")){ $("#cal").hidden = true; return; }
  if ((b = t.closest("[data-cal]"))){ CAL.m += parseInt(b.dataset.cal, 10); if (CAL.m < 0){ CAL.m = 11; CAL.y--; } if (CAL.m > 11){ CAL.m = 0; CAL.y++; } renderCal(); return; }
  if ((b = t.closest("[data-day]"))){ CAL.sel = b.dataset.day; renderCal(); return; }
  if (t.closest("[data-calweek]")){ $("#cal").hidden = true; view = "wk"; render(); window.scrollTo(0, 0); return; }
  if (t.closest("[data-caltoday]")) openCal();
});
/* ---------- installation (Android / Chrome) ---------- */
var deferredInstall = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredInstall = e; $("#instbar").hidden = false; });
window.addEventListener("appinstalled", function(){ deferredInstall = null; $("#instbar").hidden = true; });
$("#inst").addEventListener("click", function(){
  if (!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function(){ deferredInstall = null; $("#instbar").hidden = true; }, function(){});
});
if ("serviceWorker" in navigator && location.protocol === "https:"){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
(function boot(){
  if (lget(PINK)){ if (sget()) startApp(); else showLock("ask", "boot"); }
  else if (lget(NOPK)) startApp();
  else showLock("new", "boot");
})();
</script>
</body>
</html>
